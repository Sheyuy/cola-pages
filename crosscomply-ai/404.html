<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrossComply AI - 跨境合规智能体</title>
    <script>
      // GitHub Pages SPA: 保存当前路径 → 跳转首页 → 由 React Router 接管
      sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
      location.replace('/cola-pages/crosscomply-ai/');
    </script>
  </head>

</html>
